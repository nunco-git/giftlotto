<style>

.ov-close{position:fixed;top:12px;right:12px;z-index:51;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}

@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, collection, getDoc, getDocs, setDoc, updateDoc, onSnapshot, runTransaction, writeBatch, query, where, orderBy, startAfter, serverTimestamp, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   ★ 여기에 Firebase 웹앱 설정값을 붙여넣으세요 (Firebase 콘솔 > 프로젝트 설정 > 내 앱)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBSQEZH30PExd1FfbZzmmXa3ALBEImxNmg",
  authDomain: "giftlotto.firebaseapp.com",
  projectId: "giftlotto",
  storageBucket: "giftlotto.firebasestorage.app",
  messagingSenderId: "258354137219",
  appId: "1:258354137219:web:9ce777bf07d7f8b6e573b6",
  measurementId: "G-HS7ZVW9J11"
};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const app = $('#app');
let MAX = 100, DIGITS = 3;
const pad = n => String(n).padStart(DIGITS, '0');
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
function randInt(min, max) {
  const range = max - min + 1, lim = Math.floor(0x100000000 / range) * range, a = new Uint32Array(1);
  let x; do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim);
  return min + (x % range);
}
function sample(arr, k) {
  const a = arr.slice(), n = a.length; k = Math.min(k, n);
  for (let i = 0; i < k; i++) { const j = randInt(i, n - 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, k);
}
const rnd = () => pad(randInt(1, Math.max(1, MAX)));
const params = new URLSearchParams(location.search);
const EID = params.get('e'), VIEW = params.get('view');
const baseUrl = () => location.origin + location.pathname;
const checkinUrl = eid => baseUrl() + '?e=' + eid;
/* 행사 당일(한국시간 00:00 ~ 24:00) 범위. purgeAt: 개인정보 문서의 자동 삭제(TTL) 기준 시각 */
const dayTimes = ds => { const s = new Date(ds + 'T00:00:00+09:00'); const e = new Date(s.getTime() + 864e5); return { eventDate: ds, startAt: s, endAt: e, purgeAt: e }; };
const todayKST = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
const liveInfoCache = new Map();
async function resolveLive(eid, live) {
  if (!live || live.phase !== 'done' || !live.hasInfo) return live;
  if (!liveInfoCache.has(live.id)) {
    try { const s = await getDoc(doc(db, 'events', eid, 'liveinfo', String(live.id))); liveInfoCache.set(live.id, s.exists() ? (s.data().info || []) : []); }
    catch (e) { liveInfoCache.set(live.id, []); }
  }
  return { ...live, info: liveInfoCache.get(live.id) };
}

const configured = firebaseConfig.projectId && !firebaseConfig.apiKey.includes('여기에');
let auth, db;

/* ---------------- 설정 안내 ---------------- */
function showSetup() {
  app.innerHTML = `<div class="setup"><h1>🎁 스마트 경품추첨 · 최초 설정</h1>
  <p>이 파일 상단의 <code>firebaseConfig</code>에 Firebase 설정값을 붙여넣어야 동작합니다.</p>
  <ol>
  <li>Firebase 콘솔에서 프로젝트 생성 → 웹앱 추가 → 설정값을 복사해 이 파일의 <code>firebaseConfig</code>에 붙여넣기</li>
  <li><b>Authentication</b> → 로그인 방법 → <b>익명</b>, <b>Google</b> 사용 설정 (익명=참석자, Google=관리자)</li>
  <li>Authentication → 설정 → 승인된 도메인에 배포 주소(예: <code>계정명.github.io</code>) 추가</li>
  <li><b>Firestore Database</b> 생성 후, 함께 제공된 <code>firestore.rules</code> 내용을 규칙 탭에 붙여넣고 게시</li>
  <li>이 파일을 GitHub Pages 등에 올려 배포 (QR은 배포 주소로 만들어집니다)</li>
  </ol></div>`;
}

/* ---------------- 무대 화면(프로젝터) ---------------- */
function confetti() {
  const cols = ['#ffd666', '#ff7875', '#69c0ff', '#95de64', '#b37feb'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i'); c.className = 'conf';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % 5];
    c.style.animationDelay = Math.random() * 0.8 + 's'; c.style.animationDuration = 2.4 + Math.random() * 1.6 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}
function makeStage(root, getEv) {
  let timer = null, tok = 0, prevRolling = 0, lastKey = '', destroyed = false;
  const clear = () => { clearInterval(timer); timer = null; };
  const sizeClass = n => n <= 4 ? 's1' : n <= 10 ? 's2' : n <= 24 ? 's3' : n <= 60 ? 's4' : 's5';
  const cardsHTML = (n, vals, infos) => `<div class="cardsw"><div class="cards ${sizeClass(n)}">` +
    Array.from({ length: n }, (_, i) => `<div class="card"><span>${vals ? pad(vals[i]) : rnd()}</span>${infos && infos[i] ? `<small>${esc(infos[i])}</small>` : ''}</div>`).join('') + `</div></div>`;
  const reserveHTML = r => r && r.length ? `<div class="st-reserve">예비 당첨 ${r.map(n => `<b>${pad(n)}</b>`).join('')}</div>` : '';
  function idle() {
    clear(); const ev = getEv() || {};
    root.innerHTML = `<div class="st-title">${esc(ev.name || '')}</div><div class="st-sub">경품 추첨</div><div class="st-qr" id="stqr"></div><div class="st-sub">휴대폰 카메라로 QR을 찍어 참석 체크인을 하세요</div>`;
    try { new QRCode($('#stqr', root), { text: checkinUrl(EID_CUR()), width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { }
  }
  function rolling(live) {
    clear(); const n = Math.min(live.count || 1, 100);
    root.innerHTML = `<div class="st-title">${esc(live.title)}</div><div class="st-sub">추첨 중…</div>${cardsHTML(n)}`;
    const spans = [...root.querySelectorAll('.card span')];
    timer = setInterval(() => spans.forEach(s => s.textContent = rnd()), 70);
  }
  function showStatic(live) {
    clear();
    root.innerHTML = `<div class="st-title">${esc(live.title)}</div><div class="st-sub">🎉 당첨을 축하합니다 🎉</div>${cardsHTML(live.numbers.length, live.numbers, live.info)}${reserveHTML(live.reserve)}`;
    root.querySelectorAll('.card').forEach(c => c.classList.add('locked'));
  }
  function reveal(live) {
    clear(); const my = tok, nums = live.numbers;
    root.innerHTML = `<div class="st-title">${esc(live.title)}</div><div class="st-sub">🎉 당첨을 축하합니다 🎉</div>${cardsHTML(nums.length, null, live.info)}`;
    const cards = [...root.querySelectorAll('.card')], spans = cards.map(c => c.firstElementChild);
    let locked = 0; const gap = Math.max(40, Math.min(500, 3500 / Math.max(1, nums.length)));
    timer = setInterval(() => { for (let i = locked; i < spans.length; i++) spans[i].textContent = rnd(); }, 70);
    (async () => {
      for (let i = 0; i < nums.length; i++) {
        await sleep(gap); if (my !== tok || destroyed) return;
        spans[i].textContent = pad(nums[i]); cards[i].classList.add('locked'); locked = i + 1;
      }
      clear(); confetti();
      root.insertAdjacentHTML('beforeend', reserveHTML(live.reserve));
    })();
  }
  function update(live) {
    if (destroyed) return;
    const key = live ? live.id + ':' + live.phase : 'none';
    if (key === lastKey) return;
    lastKey = key; tok++;
    if (!live) return idle();
    if (live.phase === 'rolling') { prevRolling = live.id; return rolling(live); }
    if (live.instant || prevRolling !== live.id) showStatic(live); else reveal(live);
    prevRolling = 0;
  }
  return { update, destroy() { destroyed = true; clear(); tok++; } };
}
let _eidCur = null; const EID_CUR = () => _eidCur;

async function stagePage() {
  document.body.classList.add('stage'); _eidCur = EID;
  const evRef = doc(db, 'events', EID);
  app.innerHTML = '<div class="stage-root"></div>';
  let ev = null;
  const stage = makeStage($('.stage-root'), () => ev);
  let seq = 0;
  onSnapshot(evRef, s => {
    if (!s.exists()) { $('.stage-root').innerHTML = '<div class="st-title">존재하지 않는 행사입니다</div>'; return; }
    ev = s.data(); MAX = ev.maxCount; DIGITS = String(MAX).length;
    const my = ++seq; resolveLive(EID, ev.live || null).then(l => { if (my === seq) stage.update(l); });
  });
  document.addEventListener('dblclick', () => document.documentElement.requestFullscreen?.());
}

/* ---------------- 참석자(휴대폰) 화면 ---------------- */
async function attendeePage() {
  document.body.classList.add('phone');
  const evRef = doc(db, 'events', EID);
  let s; try { s = await getDoc(evRef); } catch (e) { app.innerHTML = '<div class="ph"><div class="pcard">행사 정보를 불러올 수 없습니다.</div></div>'; return; }
  if (!s.exists()) { app.innerHTML = '<div class="ph"><div class="pcard">존재하지 않는 행사입니다.</div></div>'; return; }
  let ev = s.data(); MAX = ev.maxCount; DIGITS = String(MAX).length;
  const uid = auth.currentUser.uid, uref = doc(db, 'events', EID, 'users', uid);
  let num = null, ticket = null, win = null, busy = false, err = '', subbed = false, entry = null;
  const formVals = {};
  let consent = false;
  const inDay = () => !!(ev.startAt && ev.endAt) && Date.now() >= ev.startAt.toMillis() && Date.now() < ev.endAt.toMillis();
  const us = await getDoc(uref); if (us.exists()) num = us.data().number;
  if (num) { try { const es = await getDoc(doc(db, 'events', EID, 'entries', String(num))); if (es.exists()) entry = es.data().f || {}; } catch (e) { } }
  const collectVals = () => { const o = {}; (ev.fields || []).forEach(f => { const v = (formVals[f.id] || '').trim(); if (v) o[f.id] = v; }); return o; };

  function sub() {
    if (!num || subbed) return; subbed = true;
    onSnapshot(doc(db, 'events', EID, 'tickets', String(num)), d => { ticket = d.exists() ? d.data() : null; render(); });
    onSnapshot(doc(db, 'events', EID, 'wins', String(num)), d => { win = d.exists() ? d.data() : null; render(); });
  }
  async function checkin() {
    const fv = collectVals();
    for (let k = 0; k < 15; k++) {
      try {
        const n = await runTransaction(db, async tx => {
          const u = await tx.get(uref); if (u.exists()) return u.data().number;
          const c = new Set(); while (c.size < Math.min(8, MAX)) c.add(randInt(1, MAX));
          const arr = [...c];
          const snaps = await Promise.all(arr.map(x => tx.get(doc(db, 'events', EID, 'tickets', String(x)))));
          const i = snaps.findIndex(z => !z.exists()); if (i < 0) return null;
          tx.set(doc(db, 'events', EID, 'tickets', String(arr[i])), { uid, t: serverTimestamp(), presentRound: 0 });
          if (Object.keys(fv).length) tx.set(doc(db, 'events', EID, 'entries', String(arr[i])), { uid, f: fv, consent: true, t: serverTimestamp(), expireAt: ev.purgeAt });
          tx.set(uref, { number: arr[i], t: serverTimestamp() });
          return arr[i];
        });
        if (n) return n;
      } catch (e) {
        if (e.code === 'permission-denied') throw e;
      }
      await sleep(200 + Math.random() * 400);
    }
    throw new Error('retry');
  }
  function formHTML() {
    return (ev.fields || []).map(f => `<label class="fl">${esc(f.label)}${f.required ? ' <span class="err">*</span>' : ''}<input data-f="${f.id}" id="f_${f.id}" maxlength="30" autocomplete="off" value="${esc(formVals[f.id] || '')}"></label>`).join('');
  }
  function consentHTML() {
    const F = ev.fields || []; if (!F.length) return '';
    const shown = F.filter(f => f.show).map(f => f.label + (f.mask ? '(일부 가림)' : ''));
    return `<div style="text-align:left;background:#f3f5fb;border-radius:10px;padding:12px;margin:12px 0;font-size:13px;line-height:1.6">
      <b>개인정보 수집·이용 동의 (필수)</b><br>

  function entryLine() {

        else if (win.status === 'reserve') h += `<div class="win res"><div>예비 당첨 ${win.order}순위</div><div>당첨자가 불참하면 순서대로 승계됩니다<br>(${esc(win.prizeName)})</div></div>`;
        else h += `<div class="win abs">불참 처리되었습니다 (${esc(win.prizeName)})</div>`;
      }
      if (pres.open) {
        const done = ticket && ticket.presentRound === pres.round;
        h += done ? `<div class="pcard">✅ ${pres.round}차 참석 확인 완료<br><span class="mut">자리를 지켜주세요!</span></div>`
          : `<div class="pcard"><p><b>지금 자리에 계신가요?</b><br>추첨 대상 확인 중입니다.</p><button class="big pri" data-a="present" ${busy ? 'disabled' : ''}>🙋 지금 자리에 있어요</button>${err ? `<p class="err">${esc(err)}</p>` : ''}</div>`;
      }
    }
    if (live) {
      if (live.phase === 'rolling') h += `<div class="pcard"><div class="mut">진행 중</div><b style="font-size:22px">${esc(live.title)}</b><p>추첨 중입니다… 🥁</p></div>`;
      else {
        const nums = live.numbers || [];
        h += `<div class="pcard"><div class="mut">최근 추첨</div><b style="font-size:20px">${esc(live.title)}</b><div class="chips">${nums.slice(0, 40).map(n => `<span class="chip ${n === num ? 'me' : ''}">${pad(n)}</span>`).join('')}${nums.length > 40 ? `<span class="mut">외 ${nums.length - 40}명</span>` : ''}</div></div>`;
      }
    }
    const ae = document.activeElement, fid = ae && ae.dataset && ae.dataset.f, pos = fid ? ae.selectionStart : 0;
    app.innerHTML = h + '</div>';
    if (fid) { const el = document.getElementById('f_' + fid); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { } } }
  }
  app.addEventListener('input', e => { const i = e.target.closest('[data-f]'); if (i) formVals[i.dataset.f] = i.value; });
  app.addEventListener('change', e => { if (e.target.id === 'consent') consent = e.target.checked; });
  app.addEventListener('click', async e => {
    const b = e.target.closest('[data-a]'); if (!b || busy) return;
    if (b.dataset.a === 'checkin') {
      const miss = (ev.fields || []).find(f => f.required && !(formVals[f.id] || '').trim());
      if (miss) { err = `${miss.label}을(를) 입력하세요`; render(); return; }
      if ((ev.fields || []).length && !consent) { err = '개인정보 수집·이용에 동의해야 체크인할 수 있습니다'; render(); return; }
    }
    busy = true; err = ''; render();
    try {
      if (b.dataset.a === 'checkin') { num = await checkin(); entry = collectVals(); sub(); }
      if (b.dataset.a === 'present') await updateDoc(doc(db, 'events', EID, 'tickets', String(num)), { presentRound: ev.presence.round });
    } catch (ex) {
      err = ex.code === 'permission-denied' ? '지금은 처리할 수 없습니다. (마감되었거나 권한 없음)' : '일시적인 오류입니다. 다시 눌러주세요.';
    }
    busy = false; render();
  });
  onSnapshot(evRef, d => { if (d.exists()) { ev = d.data(); render(); } });
  sub(); render();
}

let cleanups = [];
function leave() { cleanups.forEach(f => { try { f(); } catch (e) { } }); cleanups = []; }

function isAdminOf(ev, u) {
  return ev.adminUid === u.uid || (u.emailVerified && (ev.adminEmails || []).includes((u.email || '').toLowerCase()));
}
function adminPage() {
  onAuthStateChanged(auth, u => {
    leave();

}

  $('#bPEnd').onclick = async () => {
    if (!(S.ev.presence?.round)) return toast('먼저 참석 확인을 시작하세요');
    await updateDoc(evRef, { presence: { round: S.ev.presence.round, open: false } });
    await loadPresent(); S.mode = 'present'; document.querySelector('input[name=mode][value=present]').checked = true; poolInfo(); counts();
    toast(`참석 확인 ${S.present.size}명 · 추첨 대상으로 설정되었습니다`);
  };
  $('#bPMark').onclick = async () => {
    const n = Math.floor(+$('#pNum').value), r = S.ev.presence?.round || 0;
    if (!r) return toast('먼저 참석 확인을 시작하세요');
    try {
      const s = await getDoc(doc(tcol, String(n))); if (!s.exists()) return toast('등록되지 않은 번호입니다');
      await updateDoc(doc(tcol, String(n)), { presentRound: r }); if (S.present) S.present.add(n);
      $('#pNum').value = ''; toast(`${pad(n)}번 참석 처리`); poolInfo(); counts();
    } catch (e) { toast('오류: ' + e.code); }
  };

  /* 현장 등록 */
  async function regTicket(n, f) {
    return runTransaction(db, async tx => {
      const r = doc(tcol, String(n)), s = await tx.get(r); if (s.exists()) return false;
      tx.set(r, { uid: u.uid, t: serverTimestamp(), presentRound: 0, proxy: true });
      if (f && Object.keys(f).length) tx.set(doc(db, 'events', eid, 'entries', String(n)), { uid: u.uid, f, consent: true, t: serverTimestamp(), expireAt: S.ev.purgeAt || new Date(Date.now() + 864e5) });
      return true;
    });
  }
  $('#bProxy').onclick = async () => {
    if (!pfOk(pf())) return;
    try {
      for (let k = 0; k < 30; k++) { const n = randInt(1, MAX); if (await regTicket(n, pf())) { clearPf(); return showNum(n); } }
      toast('빈 번호를 찾지 못했습니다. 최대 인원을 확인하세요.');
    } catch (e) { toast('오류: ' + (e.code || e.message)); }
  };
  $('#bManual').onclick = async () => {
    const n = Math.floor(+$('#mNum').value); if (!(n >= 1 && n <= MAX)) return toast(`1~${MAX} 범위의 번호를 입력하세요`);
    if (!pfOk(pf())) return;
    try { if (await regTicket(n, pf())) { clearPf(); toast(`${pad(n)}번 등록 완료`); $('#mNum').value = ''; counts(); } else toast('이미 등록된 번호입니다'); }
    catch (e) { toast('오류: ' + (e.code || e.message)); }
  };
  function showNum(n) {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box"><div class="mut">발급된 경품번호</div><div class="bignum">${pad(n)}</div><p class="mut">종이에 적어 전달해 주세요</p><button class="pri" id="mOk">확인</button></div>`;
    document.body.appendChild(m); $('#mOk', m).onclick = () => { m.remove(); counts(); };
  }

  /* 엑셀 저장 */
  $('#bXlsx').onclick = async () => {
    await getEntries([...S.wins.keys()]);
    const F = fieldsOf(), rows = [['상품', '구분', '순번', '경품번호', ...F.map(f => f.label), '수령']];
    const rank = { won: 0, reserve: 1, absent: 2 }, lab = { won: '당첨', reserve: '예비', absent: '불참' };
    for (const p of (S.ev.prizes || [])) [...S.wins.values()].filter(w => w.prizeId === p.id).sort((a, b) => rank[a.status] - rank[b.status] || a.order - b.order)
      .forEach(w => { const e = S.entries.get(w.n) || {}; rows.push([p.name, lab[w.status] + (w.promoted ? '(승계)' : ''), w.order, pad(w.n), ...F.map(f => e[f.id] || ''), w.claimed ? '수령' : '']); });
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '추첨결과');
    XLSX.writeFile(wb, `${S.ev.name}_추첨결과.xlsx`);
  };
  $('#bXlsxAll').onclick = async () => {
    try {
      const F = fieldsOf(), qs = await getDocs(collection(db, 'events', eid, 'entries')), rows = [['경품번호', ...F.map(f => f.label)]];
      qs.docs.map(d => ({ n: Number(d.id), f: d.data().f || {} })).sort((a, b) => a.n - b.n).forEach(r => rows.push([pad(r.n), ...F.map(f => r.f[f.id] || '')]));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '참석자명단');
      XLSX.writeFile(wb, `${S.ev.name}_참석자명단.xlsx`);
    } catch (ex) { toast('오류: ' + (ex.code || ex.message)); }
  };
  renderAll(); renderResults(); poolInfo();
}

/* ---------------- 시작 ---------------- */
async function boot() {
  if (!configured) return showSetup();
  const fb = initializeApp(firebaseConfig); auth = getAuth(fb); db = getFirestore(fb);
  if (EID) {
    await new Promise(res => { const un = onAuthStateChanged(auth, () => { un(); res(); }); });
    if (!auth.currentUser) await signInAnonymously(auth);
    return VIEW === 'screen' ? stagePage() : attendeePage();
  }
  adminPage();
}
boot();
</script>
</body>
</html>
